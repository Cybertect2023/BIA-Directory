name: Browser check live visitor pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/browser-check-visitor-pages.yml'

permissions:
  contents: write

jobs:
  check-live:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Chromium browser
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Check published Squarespace at desktop and mobile widths
        run: python scripts/check-live-squarespace.py || echo 'Browser check flagged problems; see report'
      - name: Commit browser audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add launch/live-pages-browser.json
          if ! git diff --staged --quiet; then
            git commit -m "Record real-browser smoke test of eight visitor pages"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Fail if a visitor page did not load
        run: |
          python - <<'PY'
          import json
          data=json.load(open("launch/live-pages-browser.json"))
          failed=[f for f in data["results"] if f["status"]=="fail"]
          print(f"Hard browser failures: {len(failed)}")
          for f in failed: print(f["path"],f["viewport"],f.get("error",""))
          if failed: raise SystemExit(1)
          PY

name: Check live More to Explore guide sections
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/check-more-explore-live.yml'
permissions:
  contents: write
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Playwright
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Test all three linked page sections on desktop and phone
        run: python scripts/check-more-explore-live.py
      - name: Store live audit and viewport screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add launch/more-explore-live-audit.json previews/more-explore-*.jpg
          if ! git diff --staged --quiet; then
            git commit -m "Record live More to Explore guide QA"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

name: Check public visitor page launch

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/check-visitor-routes.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check public Squarespace visitor routes
        run: |
          node --input-type=module <<'NODE'
          import {writeFileSync,mkdirSync} from 'node:fs';
          const origin='https://www.visitstirlingrawdon.ca';
          const paths=['/','/explore-and-enjoy','/farms-local-food','/things-to-do','/community-events','/local-stories','/eat-and-drink','/shop-local','/plan-your-visit','/events','/business-directory'];
          const results=[];
          for(const path of paths){
            let status=0,finalUrl='',title='',hasEmbed=false,hasExpectedKey=false,hasNoindex=false,hasLoginWall=false,error='';
            const ac=new AbortController();const timer=setTimeout(()=>ac.abort(),18000);
            try {
              const response=await fetch(origin+path,{redirect:'follow',signal:ac.signal,headers:{'User-Agent':'StirlingRawdonBIA-LaunchAudit/1.0 (site-maintainer; GitHub Actions)'}});
              status=response.status;
              finalUrl=response.url;
              const html=await response.text();
              title=html.match(/<title[^>]*>([\s\S]*?)<\/title>/i)?.[1]?.trim().slice(0,180)||'';
              hasEmbed=html.includes('bia-explore-page');
              hasExpectedKey=html.includes('data-explore-page')&&html.includes(path.slice(1));
              hasNoindex=/<meta[^>]+(?:name=['"]robots['"][^>]+content=['"][^'"]*noindex|content=['"][^'"]*noindex[^'"]*['"][^>]+name=['"]robots)/i.test(html);
              hasLoginWall=/site is private|site password|enter password|password protected/i.test(html.slice(0,15000));
            }catch(e){error=String(e).slice(0,260)}
            finally {clearTimeout(timer)}
            results.push({path,status,finalUrl,title,hasEmbed,hasExpectedKey,hasNoindex,hasLoginWall,error});
            console.log(JSON.stringify(results.at(-1)));
          }
          mkdirSync('launch',{recursive:true});
          writeFileSync('launch/live-pages-audit.json',JSON.stringify({checkedAt:new Date().toISOString(),origin,results},null,2)+'\n');
          NODE
      - name: Commit route audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add launch/live-pages-audit.json
          if ! git diff --staged --quiet; then
            git commit -m "Record published Squarespace visitor-page route accessibility"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

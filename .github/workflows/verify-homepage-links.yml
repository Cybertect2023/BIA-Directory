name: Verify live homepage destinations

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-homepage-links.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Check actual homepage CTA destinations and calendar title
        run: node scripts/check-live-homepage.mjs
      - name: Save findings for BIA launch checklist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add launch/homepage-live-audit.json
          if ! git diff --staged --quiet; then
            git commit -m "Record live homepage navigation audit"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

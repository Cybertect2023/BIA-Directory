name: Render visitor-page previews

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/render-visitor-previews.yml'
      - 'scripts/render-visitor-previews.py'
permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install screenshot dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright pillow
          python -m playwright install --with-deps chromium

      - name: Render seven visitor templates
        run: python scripts/render-visitor-previews.py

      - name: Commit preview images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add previews/
          if git diff --staged --quiet; then
            echo "No preview changes."
          else
            git commit -m "Update browser-rendered previews of Stirling visitor pages"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

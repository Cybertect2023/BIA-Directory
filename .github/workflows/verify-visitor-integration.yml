name: Verify connected visitor pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-visitor-integration.yml'
      - 'scripts/check-visitor-crosslinks.mjs'
      - 'pages/*.html'
      - 'assets/explore-loader.js'
      - 'assets/explore.css'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install existing test dependencies
        run: npm ci --ignore-scripts
      - name: Validate seven visitor guides and interactive map deep links
        run: node scripts/check-visitor-crosslinks.mjs
      # Full map coverage is an independent verification workflow, requested
      # manually while the newly expanded 73-business directory is reconciled.
      - name: Verify map generator has no stale outputs
        if: github.event_name == 'workflow_dispatch'
        run: npm test
      - name: Test interactive map in simulated DOM
        if: github.event_name == 'workflow_dispatch'
        run: npm run test:dom
      - name: Check JavaScript syntax
        run: |
          node --check assets/explore-loader.js
          node --check assets/visitor-map.js

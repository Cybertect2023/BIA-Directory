name: Verify live Explore guide card sizes
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-explore-card-sizes.yml'
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser tools
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Measure live desktop and phone cards
        run: python scripts/check-live-card-sizes.py || true
      - name: Commit measurements and screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add launch/live-guide-card-sizes.json previews/explore-guide-cards-*.jpg
          if ! git diff --staged --quiet; then
            git commit -m "Record live Explore card image and content heights"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Enforce measured sizes
        run: |
          python - <<'PY'
          import json
          data=json.load(open("launch/live-guide-card-sizes.json"))
          assert all(x["pass"] for x in data["results"]),data["results"]
          print("Live card height verification passed.")
          PY
